apply from: rootProject.file('gradle/node.gradle')
apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'

base {
    archivesName = "${rootProject.property('mod_id')}-common"
}

tasks.named('test') {
    inputs.dir(rootProject.file('examples/scenarios'))
        .withPropertyName('scenarioLibrary')
        .withPathSensitivity(PathSensitivity.RELATIVE)
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    if (!unobfuscated) mappings loom.officialMojangMappings()
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.2'
}
