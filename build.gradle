plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.17' apply false
    id 'net.neoforged.moddev' version '2.0.143' apply false
}

subprojects {
    apply plugin: 'java-library'

    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net' }
        maven { name = 'NeoForge'; url = 'https://maven.neoforged.net/releases' }
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(rootProject.property('java_version') as int)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = rootProject.property('java_version') as int
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
