plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT' apply false
    id 'net.neoforged.gradle.userdev' version '7.0.190' apply false
}

subprojects {
    apply plugin: 'java-library'

    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net' }
        maven { name = 'NeoForge'; url = 'https://maven.neoforged.net/releases' }
        maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/repository/maven-public' }
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(rootProject.property('java_version') as int)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = rootProject.property('java_version') as int
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
