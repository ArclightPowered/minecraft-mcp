apply from: rootProject.file('gradle/node.gradle')
// common's node for this Minecraft version; its sources are compiled into this jar
def commonNode = stonecutter.node.sibling('common').project
evaluationDependsOn(commonNode.path)
apply plugin: 'net.neoforged.moddev'

base {
    archivesName = "${rootProject.property('mod_id')}-neoforge"
}


neoForge {
    version = neoforge_version

    runs {
        // One directory per side: both sides write mcp/server.json, and sharing a run dir means
        // whichever started last wins and an agent gets the wrong token.
        client {
            client()
            gameDirectory = file('run/client')
        }
        server {
            server()
            gameDirectory = file('run/server')
        }
    }

    mods {
        "${rootProject.property('mod_id')}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
}

// The last source dir of common's node is the copy Stonecutter processed for this version.
def commonGenerate = commonNode.tasks.matching { it.name == 'stonecutterGenerate' }
tasks.named('compileJava', JavaCompile) {
    dependsOn commonGenerate
    source commonNode.sourceSets.main.java.srcDirs.toList().last()
}

processResources {
    dependsOn commonGenerate
    from(commonNode.sourceSets.main.resources.srcDirs.toList().last())
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', minecraft_version
    inputs.property 'neoforge_version_range', neoforge_version_range
    ['mod_id', 'mod_name', 'mod_description', 'mod_author', 'mod_license'].each { key -> inputs.property key, rootProject.property(key) }
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version,
                minecraft_version: minecraft_version,
                neoforge_version_range: neoforge_version_range,
                mod_id: rootProject.property('mod_id'),
                mod_name: rootProject.property('mod_name'),
                mod_description: rootProject.property('mod_description'),
                mod_author: rootProject.property('mod_author'),
                mod_license: rootProject.property('mod_license')
    }
}
